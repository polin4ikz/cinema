name: Clean JS branch

on:
  push:
    branches: [cleanup-js]

permissions:
  contents: write

jobs:
  clean:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only decorative comments and excess blank lines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          # Remove section-divider comments only; application comments stay intact.
          text = re.sub(r'/\*\s*=+.*?=+\s*\*/\s*', '', text, flags=re.S)
          text = re.sub(r'//\s*=+\s*\n//\s*[^\n]+\s*\n//\s*=+\s*\n?', '', text)
          text = re.sub(r'\n{3,}', '\n\n', text)
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m 'Clean script.js [cleanup-done]'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/cleanup-js.yml
          git commit -m 'Remove temporary cleanup workflow [cleanup-done]'
          git push
