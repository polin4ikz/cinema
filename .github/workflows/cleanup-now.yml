name: Apply safe cleanup patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact safe edits
        shell: python
        run: |
          from pathlib import Path
          import re

          # CSS: only remove declarations/blocks confirmed redundant.
          css = Path("style.css").read_text(encoding="utf-8")
          css = css.replace("  --black-light: #171311;\n", "", 1)
          css = css.replace('body {\n  cursor: none;\n}\n', '', 1)
          css = css.replace('.hero-red {\n  pointer-events: none !important;\n}\n', '', 1)
          css, n = re.subn(
              r'(\.movie-night-reveal\s*\{[^}]*?)\n\s*pointer-events:\s*auto;\n',
              r'\1\n',
              css,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"Expected one dead movie-night-reveal pointer-events:auto, found {n}")
          Path("style.css").write_text(css, encoding="utf-8")

          # JS: restore the missing DOM reference without touching cursor behavior.
          js = Path("script.js").read_text(encoding="utf-8")
          needle = 'const body = document.body;\n'
          addition = 'const body = document.body;\nconst cursor = document.querySelector(".cursor");\n'
          if 'const cursor = document.querySelector(".cursor");' not in js:
              if needle not in js:
                  raise SystemExit("Could not find cursor insertion point")
              js = js.replace(needle, addition, 1)
          Path("script.js").write_text(js, encoding="utf-8")

          # index.html: do not remove the old film-modal controls yet; they are still
          # part of the live modal markup and need a separate functional audit.

          # Remove this temporary workflow after the patch is committed.
          Path(".github/workflows/cleanup-now.yml").unlink()

      - name: Commit safe cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css script.js .github/workflows/cleanup-now.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Clean confirmed CSS duplicates and fix cursor reference"
          git push