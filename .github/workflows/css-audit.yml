name: Audit CSS duplicates

on:
  push:
    branches: [cleanup-css]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-css

      - name: Find exact duplicate CSS rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('style.css').read_text(encoding='utf-8')
          css = re.sub(r'/\*.*?\*/', '', css, flags=re.S)

          rules = []
          i = 0
          n = len(css)
          while i < n:
              start = css.find('{', i)
              if start < 0:
                  break
              selector_start = i
              while selector_start < start and css[selector_start].isspace():
                  selector_start += 1
              selector = css[selector_start:start].strip()
              depth = 1
              j = start + 1
              while j < n and depth:
                  if css[j] == '{': depth += 1
                  elif css[j] == '}': depth -= 1
                  j += 1
              if depth:
                  break
              body = css[start + 1:j - 1].strip()
              if selector and not selector.startswith('@'):
                  normalized = re.sub(r'\s+', ' ', body).strip()
                  rules.append((selector, normalized, css[:start].count('\n') + 1))
              i = j

          seen = {}
          duplicates = []
          for selector, body, line in rules:
              key = (selector, body)
              if key in seen:
                  duplicates.append((selector, seen[key], line))
              else:
                  seen[key] = line

          out = Path('css-audit.txt')
          if duplicates:
              out.write_text('\n'.join(f'{selector} | first line {first} | duplicate line {dup}' for selector, first, dup in duplicates) + '\n', encoding='utf-8')
          else:
              out.write_text('NO EXACT DUPLICATE RULES FOUND\n', encoding='utf-8')
          print(out.read_text())
          PY

      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css-audit.txt
          git commit -m 'Audit CSS duplicates [cleanup-audit]' || exit 0
          git push origin cleanup-css
