name: Deeper cleanup

on:
  push:
    branches:
      - cleanup-js

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clean JS safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'/\*.*?\*/', '', s, flags=re.S)
          s = re.sub(r'(^|\n)\s*//[^\n]*', r'\1', s)
          s = re.sub(r'\n\s*\n+', '\n', s)
          s = s.replace('const cursor = document.querySelector(".cursor");\n', '')
          s = s.replace('    const poolPromise = getMovieNightPool(signal);\n    const pool = await poolPromise;', '    const pool = await getMovieNightPool(signal);')
          s = s.replace('    currentMovieNightFilm = film;\n    showMovieNightResult(film);', '    showMovieNightResult(film);')
          p.write_text(s.strip() + '\n', encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git diff --cached --quiet || git commit -m 'Clean JS redundant code [cleanup-deeper]'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/deeper-cleanup.yml
          git commit -m 'Remove temporary deeper cleanup workflow [cleanup-done]'
          git push
